<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video Content Factory — Browser Workspace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="styles.css" rel="stylesheet">
  </head>
  <body class="bg-body-tertiary">
    <header class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container flex-wrap gap-2">
        <a class="navbar-brand fw-semibold" href="#projects" data-view="projects">Video Content Factory</a>
        <nav class="navbar-nav flex-row gap-2 me-lg-auto" aria-label="Primary navigation">
          <a class="nav-link px-2" href="#projects" data-view="projects">Projects</a>
          <a class="nav-link px-2" href="#applications" data-view="applications">Applications</a>
          <a class="nav-link px-2" href="#companies" data-view="companies">Companies</a>
          <a class="nav-link px-2" href="#settings" data-view="settings">Settings</a>
        </nav>
        <div class="workspace-actions d-flex flex-wrap gap-2 align-items-center">
          <button class="btn btn-sm btn-outline-light" data-view="settings">Settings</button>
          <button class="btn btn-sm btn-outline-light" data-action="export-workspace">Export workspace</button>
          <label class="btn btn-sm btn-outline-light mb-0">Choose backup<input id="import-file" type="file" accept=".json,application/json,.sqlite,application/vnd.sqlite3,application/x-sqlite3" hidden></label>
          <button class="btn btn-sm btn-outline-warning" data-action="reset-workspace">Restore sample data</button>
        </div>
      </div>
    </header>
    <main class="container py-4 py-md-5">
      <div id="notice" class="mb-3" aria-live="polite"></div>
      <div id="workspace-status" class="small text-body-secondary mb-3" aria-live="polite">Opening browser workspace…</div>
      <div id="app" aria-live="polite"><div class="text-body-secondary">Opening browser workspace…</div></div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
